services:
  postgres:
    image: postgres:17

    container_name: postgres

    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - observability-network

    restart: unless-stopped

volumes:
  postgres-data:

networks:
  observability-network:
    external: true